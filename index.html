<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简历预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="toolbar no-print">
    <div class="toolbar-top">
      <div class="toolbar-left">
        <strong>简历预览</strong>
        <label class="theme-switch">
          模板
          <select id="themeSelect" title="切换简历 UI">
            <option value="muji">木及风</option>
            <option value="classic">经典蓝</option>
            <option value="rose-red">红顶左框</option>
            <option value="blue-circle">蓝顶圆照</option>
            <option value="gray-sidebar">灰底右栏</option>
            <option value="red-arrow">红箭灰纹</option>
          </select>
        </label>
      </div>
      <button id="btnMenu" class="btn ghost toolbar-menu-btn" type="button" aria-expanded="false" aria-controls="toolbarActions">
        菜单
      </button>
    </div>
    <div class="toolbar-right" id="toolbarActions">
      <label class="btn ghost">
        <span class="btn-text-full">上传证件照</span><span class="btn-text-short">证件照</span>
        <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp,image/jpg" hidden />
      </label>
      <button id="btnClearAvatar" class="btn ghost toolbar-secondary" type="button">清除照片</button>
      <label class="btn ghost">
        <span class="btn-text-full">导入 MD</span><span class="btn-text-short">导入</span>
        <input id="fileInput" type="file" accept=".md,.markdown,.txt" hidden />
      </label>
      <button id="btnDemo" class="btn ghost" type="button" title="加载 examples/demo-case.md">
        <span class="btn-text-full">演示案例</span><span class="btn-text-short">演示</span>
      </button>
      <button id="btnReload" class="btn ghost toolbar-secondary" type="button">重新加载</button>
      <button id="btnEdit" class="btn ghost toolbar-secondary" type="button">编辑 MD</button>
      <button id="btnPng" class="btn ghost" type="button">导出 PNG</button>
      <button id="btnPdfPreview" class="btn ghost" type="button">
        <span class="btn-text-full">预览 PDF</span><span class="btn-text-short">预览</span>
      </button>
      <button id="btnPdf" class="btn primary" type="button">导出 PDF</button>
    </div>
  </header>

  <aside id="editorPanel" class="editor-panel no-print" hidden>
    <div class="editor-bar">
      <span>编辑 Markdown（保存后即时预览）</span>
      <button id="btnApply" class="btn primary" type="button">应用并预览</button>
    </div>
    <textarea id="mdEditor" spellcheck="false"></textarea>
  </aside>

  <main class="page-wrap">
    <div class="resume-scaler" id="resumeScaler">
      <article id="resume" class="resume rs-view"></article>
    </div>
  </main>

  <p id="loadError" class="load-error no-print" hidden></p>

  <div id="pdfPreviewModal" class="pdf-preview-modal no-print" hidden>
    <div class="pdf-preview-bar">
      <span>PDF 预览（不调用系统打印，关闭即可）</span>
      <div class="pdf-preview-actions">
        <button id="btnPdfPreviewExport" class="btn primary" type="button">从预览导出</button>
        <button id="btnPdfPreviewClose" class="btn ghost" type="button">关闭</button>
      </div>
    </div>
    <div class="pdf-preview-stage">
      <div id="pdfPreviewMount" class="pdf-preview-mount"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
